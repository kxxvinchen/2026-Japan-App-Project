<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<script>try{if(localStorage.getItem("jt_theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan Tour 2026">
<title>Japan Tour 2026 — Travel Companion</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --indigo:#1F3864; --indigo2:#2F5496; --red:#c0392b; --bg:#f4f5f7;
    --card:#ffffff; --ink:#1c2530; --muted:#6b7785; --line:#e4e7ec;
    --perf:#c0392b; --rehearse:#d68910; --exchange:#7d3c98; --sight:#138d75;
    --meal:#a0561a; --travel:#2471a3; --hotel:#1F3864; --free:#7b8794; --party:#c2185b;
  }
  /* ===== Dark mode — warm charcoal base, navy accent, layered surfaces ===== */
  html.dark{background:#16151a;}
  body.dark{
    --bg:#16151a; --card:#211f27; --card2:#2b2833; --ink:#f1edf2; --muted:#ada6b4; --line:#322e3a;
    --indigo:#3258a0; --indigo2:#3f69b5;      /* brand navy, slightly lifted so it pops on warm charcoal */
    background:#16151a;
  }
  /* gentle elevation so cards feel layered, not boxy (shadows are invisible on dark without this) */
  body.dark .set-card, body.dark .ann-card, body.dark .card, body.dark .ann-tip,
  body.dark .emerg-row, body.dark .ann-hero, body.dark .ann-compose, body.dark .ann-dd-list,
  body.dark .msg-menu{
    box-shadow:0 6px 18px rgba(0,0,0,.40), 0 1px 0 rgba(255,255,255,.05) inset;
  }
  body.dark .nav{ box-shadow:0 -4px 16px rgba(0,0,0,.35); }
  /* white surfaces → elevated dark card */
  body.dark .set-card, body.dark .ann-hero, body.dark .ann-tabs, body.dark .ann-dd,
  body.dark .ann-compose, body.dark .ann-tip, body.dark .ann-card, body.dark .msg-screen,
  body.dark .nav, body.dark .ann-dd-list, body.dark .msg-menu, body.dark .opt,
  body.dark .chan-tab, body.dark .chan-row, body.dark .emerg-row{ background:var(--card); }
  /* light-gray surfaces → secondary dark */
  body.dark .intro-note, body.dark .ann-tab, body.dark .ann-dd-toggle, body.dark .ann-compose-editing,
  body.dark .ann-subhead, body.dark .ann-empty-icon, body.dark .ph-audio, body.dark .ph-search,
  body.dark .ph-search-x, body.dark .ann-compose-input, body.dark .compose-input,
  body.dark .form-in, body.dark .flight-select, body.dark .mini-btn, body.dark .chan-tab2{ background:var(--card2); color:var(--ink); }
  body.dark .form-in::placeholder, body.dark .ann-compose-input::placeholder, body.dark .ph-search input::placeholder{ color:var(--muted); }
  body.dark .ph-search input{ background:none; color:var(--ink); }
  /* flight/bus selector — dark field AND dark dropdown list so the choice is visible */
  body.dark .flight-select{ color:var(--ink); }
  body.dark .flight-select option{ background:#232e3c; color:#f3f6fa; }
  /* announcement + selected-tab text: light (no bright blue) */
  body.dark .ann-card-author{ color:var(--ink); }
  body.dark .ann-tab.on, body.dark .ann-dd-item.sel{ background:var(--card2); color:var(--ink); }
  body.dark .opt.sel{ background:var(--card2); border-color:var(--indigo2); }
  body.dark .ann-dd-item, body.dark .ann-dd-cur{ color:var(--ink); }
  body.dark .ph-cat, body.dark .fl-who, body.dark .food-where{ color:var(--muted); }
  body.dark .btn.ghost{ background:var(--card); color:var(--ink); border-color:var(--indigo2); }
  /* functional links/map buttons stay a readable blue; active nav tab visible */
  body.dark .nav button{ color:#7b7486; }                 /* inactive: dim */
  body.dark .nav button.on{ color:var(--ink); }            /* active: bright off-white, clearly stands out */
  body.dark .msg-signed a, body.dark .food a.go, body.dark .place a.go, body.dark .mini-btn,
  body.dark .transl-banner .chev2, body.dark .ann-compose-who button{ color:#8893bd; }
  body.dark .mini-btn.active, body.dark .chan-tab.on, body.dark .chan-row.on{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  /* the dark-gray body text (#3c4651 / #4a535f / #48515c / #5a6573 family) → light & readable */
  body.dark .attire-line, body.dark .ann-card-by b, body.dark .food-sum b, body.dark .emerg-list li,
  body.dark .food-body, body.dark .guide-list li, body.dark .ann-card-body, body.dark .item-desc,
  body.dark .day-body .dhead, body.dark .fl-route, body.dark .msg-text, body.dark .log-lines li,
  body.dark .emerg-row-addr, body.dark .city-intro, body.dark .ph-search-x{ color:#ddd6e3; }
  body.dark .ph-ro{ color:var(--muted); }
  body.dark .chev, body.dark .food-chev{ color:#6b7888; }
  /* empty "no announcements yet" state — was too dim */
  body.dark .ann-empty-sub{ color:#cfc8d6; }
  body.dark .ann-empty-icon{ background:var(--card2); }
  body.dark .ann-empty-icon svg{ stroke:#8893bd; }
  body.dark .ann-tip{ color:#ddd6e3; }
  /* navy used as small text / icons / accents ON dark surfaces → readable periwinkle */
  body.dark .blk-title, body.dark .log-label, body.dark .guide-h, body.dark .emerg-row-tel,
  body.dark .msg-more, body.dark .msg-author, body.dark .ann-dd-check, body.dark .ph-audio,
  body.dark .ann-compose-editing button, body.dark .compose-editing button{ color:#9aa6cc; }
  body.dark .item-for .fchip{ background:var(--card2); color:#9aa6cc; }
  body.dark .blk-title::before{ background:#5f7cbb; }
  /* tinted badges/pills → dark translucent */
  body.dark .b-perf{ background:rgba(192,57,43,.24); }
  body.dark .b-sight{ background:rgba(19,141,117,.24); }
  body.dark .b-move{ background:rgba(36,113,163,.26); }
  body.dark .meal{ background:rgba(160,86,26,.30); }
  body.dark .item.custom .item-in{ background:rgba(125,60,152,.18); }
  body.dark .form-err{ background:rgba(192,57,43,.2); }
  body.dark .transl-banner{ background:linear-gradient(135deg,#2a2733 0%,#1d1b23 100%); box-shadow:0 8px 22px rgba(0,0,0,.5); }
  /* day date tiles: a slight top-to-bottom gradient for depth, like light mode */
  body.dark .day-tag{ background:linear-gradient(160deg,#2a4684,#1b3056); }
  /* page headers (Trip / Cities / Group / day / city …): much darker navy in dark mode */
  body.dark .hdr{ background:linear-gradient(135deg,#162c49 0%,#21406b 100%); }
  body.dark .toast{ background:#332f3c; color:#fff; }
  body.dark .ann-compose-namehint{ background:rgba(255,193,90,.12); color:#e7b86a; border-color:rgba(255,193,90,.32); }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{background:#fff;}
  /* FULL-SCREEN FLEX SHELL. height:100vh (NOT 100dvh / not fixed) because on iOS standalone
     100vh reports the true full screen, while the layout viewport (innerHeight / fixed / dvh)
     is short — which left a dead strip at the bottom. #app scrolls; #navbar is the bottom row. */
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#fff; color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  #app{flex:1 1 auto; min-height:0; width:100%; max-width:480px; margin:0 auto;
    overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--bg);}
  /* While typing in the announcements compose box, shrink the shell to the area above the
     keyboard and hide the bottom nav — so the compose bar sits just above the keyboard and the
     header/channel stay put, instead of the whole screen scrolling up. */
  body.kbd-open{ height:var(--vvh,100vh); }
  body.kbd-open #navbar{ display:none !important; }
  .screen{padding:0;}
  .screen.anim{animation:fade .25s ease;}
  /* opacity-only: a translate here desyncs position:fixed children on iOS */
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  /* Header */
  .hdr{
    background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo2) 100%);
    color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 18px 20px;
  }
  .hdr h1{font-size:20px;font-weight:700;letter-spacing:.2px;}
  .hdr .sub{font-size:12.5px;opacity:.85;margin-top:3px;}
  .hdr-row{display:flex;align-items:center;gap:10px;}
  .back{
    background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;
    border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;
  }
  .hdr-row .htxt{flex:1;min-width:0;}
  .hdr-row h1{font-size:17px;}

  /* Generic */
  .wrap{padding:16px 16px 0;}
  .card{
    background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(20,30,45,.06),0 1px 2px rgba(20,30,45,.04);
  }
  .sec-title{font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.8px;color:var(--muted);margin:18px 4px 8px;}
  /* settings card: title lives inside the box */
  .set-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,30,45,.08),0 1px 2px rgba(20,30,45,.04);}
  .set-card>h3{font-size:19px;font-weight:800;letter-spacing:-.2px;color:var(--ink);margin:0;}
  .set-card>.set-sub{font-size:13px;color:var(--muted);margin:3px 0 14px;}
  .set-card .btn{margin-top:14px;}
  .set-card .flight-select{margin-top:0;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;
    border-radius:20px;background:#eef1f5;color:var(--muted);}

  /* Group banner */
  .grp-banner{
    display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.13);
    border-radius:10px;padding:8px 11px;margin-top:13px;font-size:12.5px;cursor:pointer;
  }
  .grp-dot{width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 auto;}
  .grp-banner b{font-weight:600;}
  .grp-banner .chg{margin-left:auto;font-size:11px;opacity:.8;}
  /* Translation guide — a prominent, elevated card that pops on the indigo header */
  .transl-banner{display:flex;align-items:center;gap:12px;margin-top:15px;cursor:pointer;
    background:linear-gradient(135deg,#ffffff 0%,#eef2fb 100%);border-radius:15px;padding:13px 14px;
    box-shadow:0 8px 22px rgba(10,18,38,.22);transition:transform .12s ease,box-shadow .12s ease;}
  .transl-banner:active{transform:scale(.985);box-shadow:0 4px 14px rgba(10,18,38,.2);}
  .transl-ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;color:#fff;font-size:21px;font-weight:800;
    display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--indigo),var(--indigo2));
    box-shadow:0 3px 8px rgba(31,56,100,.35);}
  .transl-tx{flex:1;min-width:0;}
  .transl-tx .t{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:.1px;}
  .transl-tx .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3;}
  .transl-banner .chev2{flex:0 0 auto;color:var(--indigo);font-size:22px;font-weight:700;line-height:1;}
  .emerg-banner{background:rgba(229,57,53,.92);font-weight:700;}
  .emerg-banner .chg{opacity:.95;}
  /* Emergency screen */
  .emerg-hdr{background:linear-gradient(135deg,#c62828,#e53935);}
  .emerg-calls{display:flex;gap:10px;margin:14px 0 16px;}
  .emerg-call{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;
    background:#e53935;color:#fff;border-radius:14px;padding:14px 8px;box-shadow:0 2px 6px rgba(229,57,53,.3);}
  .emerg-call-num{font-size:26px;font-weight:800;line-height:1;}
  .emerg-call-lbl{font-size:12px;font-weight:600;opacity:.95;}
  .emerg-proc{margin-top:12px;}
  .emerg-proc:first-child{margin-top:4px;}
  .emerg-proc-h{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .emerg-list{margin:0;padding-left:18px;}
  .emerg-list li{font-size:13px;color:#3c4651;line-height:1.5;margin-bottom:4px;}
  .emerg-row{display:block;text-decoration:none;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;margin-top:9px;background:#fbfcfe;}
  .emerg-row-city{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .emerg-row-name{font-size:14px;font-weight:700;color:var(--ink);margin-top:2px;}
  .emerg-row-addr{font-size:12px;color:#5a6573;margin-top:2px;line-height:1.4;}
  .emerg-row-tel{font-size:13px;font-weight:700;color:var(--indigo);margin-top:5px;}
  .emerg-tag{display:inline-block;font-size:10px;font-weight:700;color:#2e7d32;background:#e3f3e6;border-radius:6px;padding:1px 6px;vertical-align:middle;}

  /* Trip route */
  .route{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
  .route .stop{background:rgba(255,255,255,.16);font-size:11px;padding:3px 9px;
    border-radius:20px;}
  .route .arr{opacity:.6;font-size:11px;align-self:center;}

  /* Stat row */
  .stats{display:flex;gap:10px;margin-top:14px;}
  .stat{flex:1;background:rgba(255,255,255,.12);border-radius:11px;padding:9px 6px;text-align:center;}
  .stat .n{font-size:19px;font-weight:700;}
  .stat .l{font-size:10px;opacity:.82;text-transform:uppercase;letter-spacing:.5px;}

  /* Day list cards */
  .day-card{display:flex;gap:12px;align-items:stretch;cursor:pointer;}
  .day-tag{
    flex:0 0 52px;background:linear-gradient(160deg,var(--indigo),var(--indigo2));
    color:#fff;border-radius:11px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:6px 0;
  }
  .day-tag .dn{font-size:9px;font-weight:600;opacity:.85;letter-spacing:.5px;}
  .day-tag .dd{font-size:21px;font-weight:800;line-height:1;}
  .day-tag .dm{font-size:9.5px;opacity:.85;}
  .day-body{flex:1;min-width:0;}
  .day-body .dcity{font-weight:700;font-size:15px;}
  .day-body .ddate{font-size:11.5px;color:var(--muted);}
  .day-body .dhead{font-size:12.5px;color:#48515c;margin-top:3px;}
  .day-badges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .b-perf{background:#fdecea;color:var(--perf);}
  .b-sight{background:#e7f6f2;color:var(--sight);}
  .b-move{background:#e8f1f8;color:var(--travel);}
  .chev{align-self:center;color:#c4ccd6;font-size:20px;flex:0 0 auto;}

  /* Day detail */
  .meal-row{display:flex;flex-wrap:wrap;gap:6px;}
  .meal{font-size:11px;background:#f4ede4;color:var(--meal);font-weight:600;
    padding:3px 9px;border-radius:20px;}
  .attire-line{font-size:13px;color:#3c4651;line-height:1.5;}
  .attire-line+.attire-line{margin-top:5px;}
  .attire-who{font-weight:700;color:var(--ink);}
  /* Translation guide */
  .ph-search{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin:0 0 14px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);}
  .ph-search svg{flex:0 0 auto;width:17px;height:17px;color:var(--muted);}
  .ph-search input{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;
    font-size:14px;color:var(--ink);padding:12px 0;-webkit-appearance:none;}
  .ph-search input::-webkit-search-decoration,.ph-search input::-webkit-search-cancel-button{display:none;}
  .ph-search-x{flex:0 0 auto;width:22px;height:22px;border:none;border-radius:50%;cursor:pointer;
    background:#e1e6ee;color:#5a6573;font-size:15px;line-height:1;align-items:center;justify-content:center;}
  .ph-noresult{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px;}
  .ph-cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    color:var(--indigo);margin:18px 2px 8px;}
  .ph-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;
    padding:12px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,30,45,.06);}
  .ph-txt{flex:1;min-width:0;}
  .ph-en{font-size:12.5px;color:var(--muted);font-weight:600;}
  .ph-ja{font-size:17px;color:var(--ink);font-weight:700;line-height:1.4;margin:2px 0 1px;}
  .ph-ro{font-size:12.5px;color:#5a6573;font-style:italic;}
  .ph-audio{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:#e8edf6;color:var(--indigo);display:flex;align-items:center;justify-content:center;}
  .ph-audio svg{width:20px;height:20px;}
  .ph-audio:active{background:var(--indigo);color:#fff;}

  .blk-title{font-size:13px;font-weight:800;color:var(--indigo);
    margin:16px 4px 6px;display:flex;align-items:center;gap:7px;}
  .blk-title::before{content:"";width:5px;height:14px;border-radius:3px;
    background:var(--indigo);display:inline-block;}

  .item{
    background:var(--card);border-radius:12px;margin-bottom:9px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);overflow:hidden;
    border-left:4px solid var(--free);
  }
  .item.t-performance{border-left-color:var(--perf);}
  .item.t-rehearsal{border-left-color:var(--rehearse);}
  .item.t-exchange{border-left-color:var(--exchange);}
  .item.t-sightseeing{border-left-color:var(--sight);}
  .item.t-meal{border-left-color:var(--meal);}
  .item.t-travel{border-left-color:var(--travel);}
  .item.t-hotel{border-left-color:var(--hotel);}
  .item.t-party{border-left-color:var(--party);}
  .item-in{padding:11px 12px;}
  .item.excluded{opacity:.5;}
  .item.excluded .item-title{text-decoration:line-through;}
  .item-top{display:flex;align-items:baseline;gap:8px;}
  .item-hr{font-size:11.5px;font-weight:700;color:var(--muted);flex:0 0 auto;
    font-variant-numeric:tabular-nums;}
  .item-title{font-weight:700;font-size:14px;flex:1;}
  .type-chip{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 7px;border-radius:5px;flex:0 0 auto;color:#fff;}
  .c-performance{background:var(--perf);}.c-rehearsal{background:var(--rehearse);}
  .c-exchange{background:var(--exchange);}.c-sightseeing{background:var(--sight);}
  .c-meal{background:var(--meal);}.c-travel{background:var(--travel);}
  .c-hotel{background:var(--hotel);}.c-free{background:var(--free);}
  .c-party{background:var(--party);}
  .item-desc{font-size:12.5px;color:#4a535f;margin-top:5px;}
  .item-gnote{font-size:11px;color:var(--exchange);font-weight:600;margin-top:4px;}
  .item-for{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;align-items:center;}
  .item-for .flabel{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .item-for .fchip{font-size:9.5px;font-weight:700;background:#eaeef4;color:var(--indigo2);
    padding:2px 7px;border-radius:5px;}
  .item-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .mini-btn{
    font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;
    color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  }
  .mini-btn.map{border-color:#cfe0d9;color:var(--sight);}
  .mini-btn.ex{border-color:#f1d0cc;color:var(--perf);}
  .mini-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .note-box{margin-top:8px;}
  .note-box textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
    font:inherit;font-size:12px;resize:vertical;min-height:46px;
  }
  .item.custom .item-in{background:#fbf7ff;}

  /* Full logistics (collapsible) */
  .log-toggle{margin-top:4px;}
  .log-wrap{margin-top:6px;}
  .log-block{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);border-left:4px solid var(--indigo2);}
  .log-label{font-size:12.5px;font-weight:800;color:var(--indigo);margin-bottom:5px;}
  .log-lines{list-style:none;margin:0;padding:0;}
  .log-lines li{font-size:12px;color:#3c4651;padding:3px 0 3px 14px;position:relative;
    font-variant-numeric:tabular-nums;line-height:1.45;}
  .log-lines li::before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;
    border-radius:50%;background:var(--indigo2);}

  /* Places card */
  .place{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .place:last-child{border-bottom:none;}
  .place-ic{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
  .pi-hotel{background:var(--hotel);}.pi-venue{background:var(--perf);}
  .pi-sight{background:var(--sight);}
  .place-tx{flex:1;min-width:0;}
  .place-tx .pn{font-size:13px;font-weight:600;}
  .place-tx .pk{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .place a.go{font-size:11px;font-weight:700;color:var(--sight);text-decoration:none;
    border:1px solid #cfe0d9;border-radius:8px;padding:5px 9px;flex:0 0 auto;}

  /* City guide */
  .city-card{cursor:pointer;display:flex;gap:12px;align-items:center;}
  .city-thumb{width:54px;height:54px;border-radius:12px;flex:0 0 auto;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
    background:linear-gradient(150deg,var(--indigo),var(--red));}
  .guide-h{font-size:13px;font-weight:800;color:var(--indigo);margin:16px 4px 7px;}
  .guide-list{list-style:none;}
  .guide-list li{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);
    display:flex;gap:8px;}
  .guide-list li:last-child{border-bottom:none;}
  .guide-list li b{color:var(--ink);}
  .dotmk{color:var(--red);font-weight:800;flex:0 0 auto;}
  .food{border-bottom:1px solid var(--line);}
  .food:last-child{border-bottom:none;}
  .food-sum{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;font-size:13px;list-style:none;}
  .food-sum::-webkit-details-marker{display:none;}
  .food-sum b{flex:1;color:var(--ink);font-weight:700;}
  .food-chev{color:#c4ccd6;font-size:12px;transition:transform .2s;}
  details[open] .food-chev{transform:rotate(180deg);}
  .food-body{font-size:12.5px;color:#4a535f;padding:2px 0 12px 20px;line-height:1.5;}
  .food-body .mini-btn{display:inline-flex;}
  .food-where{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:11px 0 7px;}
  .food-places{display:flex;flex-wrap:wrap;gap:8px;}

  /* Group picker */
  .opt{
    display:flex;align-items:center;gap:12px;padding:13px;border:2px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;
  }
  .opt.sel{border-color:var(--indigo);background:#f3f6fb;}
  .opt-radio{width:23px;height:23px;border-radius:6px;border:2px solid #c4ccd6;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;}
  .opt.sel .opt-radio{border-color:var(--indigo);background:var(--indigo);}
  .opt-tx .on{font-weight:700;font-size:14px;}
  .opt-tx .od{font-size:11.5px;color:var(--muted);}
  .grp-head{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
    color:var(--red);margin:14px 4px 8px;}

  .btn{
    display:block;width:100%;background:var(--indigo);color:#fff;border:none;
    padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    margin-top:8px;
  }
  .btn:disabled{opacity:.45;}
  .btn.ghost{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo);}

  /* Bottom nav — the last row of the 100vh flex shell, so it sits at the true screen
     bottom (not the short layout viewport). Cushion = home-indicator safe area. */
  .nav{
    flex:0 0 auto; width:100%; max-width:480px; margin:0 auto;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding:2px 0 max(8px, env(safe-area-inset-bottom));z-index:50;
  }
  .nav button{
    position:relative;flex:1;background:none;border:none;cursor:pointer;color:var(--muted);
    font-size:10.5px;font-weight:600;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:2px 0;
  }
  .nav button.on{color:var(--indigo);}
  .nav-badge{position:absolute;top:0;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;
    background:#e53935;box-shadow:0 0 0 2px #fff;}
  .nav svg{width:22px;height:22px;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 16px;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;}
  .legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .intro-note{font-size:11.5px;color:var(--muted);background:#eef1f5;border-radius:10px;
    padding:9px 11px;margin-top:10px;}
  .toast{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
    opacity:0;transition:opacity .25s;z-index:99;pointer-events:none;
  }
  .toast.show{opacity:.95;}
  /* Flight banner & details */
  .flight-dot,.bus-dot{width:auto;height:auto;background:none;font-size:13px;line-height:1;}
  .flight-banner{margin-top:8px;}
  .flight-select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;font-size:13px;background:#fff;color:var(--ink);margin-bottom:10px;}
  .fl-who{font-size:12.5px;color:var(--indigo2);font-weight:700;margin:2px 4px 8px;}
  .fl-card{padding:12px 13px;}
  .fl-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    color:var(--indigo);margin-bottom:6px;}
  .fl-meta{font-size:11.5px;color:var(--muted);margin-bottom:4px;line-height:1.45;}
  .fl-leg{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;}
  .fl-no{font-size:13px;font-weight:800;color:var(--ink);}
  .fl-air{font-size:11px;font-weight:600;color:var(--muted);}
  .fl-route{font-size:12.5px;color:#3c4651;margin-top:2px;}
  .fl-times{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:3px;
    font-variant-numeric:tabular-nums;}
  .fl-note{font-size:11px;color:var(--exchange);margin-top:3px;}
  .fl-leg .mini-btn{margin-top:7px;}

  /* Messages */
  .msg{position:relative;background:var(--card);border-radius:12px;padding:12px 13px;margin-bottom:10px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);border-left:4px solid var(--indigo2);}
  .msg-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .msg-chan{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 8px;border-radius:20px;color:#fff;background:var(--indigo2);}
  .ch-all{background:var(--indigo);}.ch-band{background:var(--rehearse);}
  .ch-orch{background:var(--travel);}.ch-choir{background:var(--exchange);}
  .msg-time{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
  .msg-title{font-weight:800;font-size:14px;margin-bottom:3px;}
  .msg-text{font-size:13px;color:#3c4651;white-space:pre-wrap;line-height:1.5;}
  .msg-text.clamp,.ann-card-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .msg-more{background:none;border:none;color:var(--indigo);font-weight:700;font-size:12px;
    padding:3px 0 0;margin:0;cursor:pointer;}
  .msg-author{font-size:12px;font-weight:800;color:var(--indigo);}
  .msg-head{display:flex;align-items:center;gap:4px;margin-bottom:4px;}
  .msg-kebab{flex:0 0 auto;margin-left:auto;background:none;border:none;color:var(--muted);font-size:17px;line-height:1;
    padding:0 0 0 4px;cursor:pointer;font-weight:700;}
  .msg-menu{position:absolute;top:30px;right:8px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;min-width:150px;}
  .msg-menu button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .msg-menu button+button{border-top:1px solid var(--line);}
  .msg-menu button.del{color:#e53935;}
  .compose-editing{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    background:#eef1f5;border-top:1px solid var(--line);padding:6px 16px;font-size:12px;font-weight:600;color:var(--muted);}
  .compose-editing button{background:none;border:none;color:var(--indigo);font-weight:700;font-size:12px;cursor:pointer;padding:2px 4px;}
  .msg-time2{font-size:10.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;}
  .msg-status{font-size:12px;color:var(--muted);padding:4px 2px 10px;}
  .msg-status.err{color:var(--perf);font-weight:600;}
  .msg-signed{font-size:12px;color:var(--muted);margin-top:16px;text-align:center;}
  .msg-signed a{color:var(--indigo2);font-weight:700;text-decoration:none;}
  .chan-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;}
  .chan-cat{width:100%;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);margin-top:6px;}
  .chan-tab{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;}
  .chan-tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .chan-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .chan-check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;background:#fff;color:var(--ink);}
  .chan-check input{accent-color:var(--indigo);width:16px;height:16px;margin:0;}
  .chan-list{margin-bottom:16px;}
  .chan-row{display:block;width:100%;text-align:left;font-size:13.5px;font-weight:600;
    padding:9px 12px;border-radius:9px;border:none;background:none;color:var(--ink);cursor:pointer;margin-bottom:2px;}
  .chan-row.on{background:var(--indigo);color:#fff;}
  .chan-row.compose{color:var(--indigo2);}
  .chan-row.compose.on{color:#fff;background:var(--indigo2);}
  /* Announcements panel: a normal full-height flex column INSIDE the scrollable #app
     (no fixed positioning). Tabs stay at top, the card list scrolls, compose stays at
     the bottom — and the shell's nav bar sits below #app, unaffected. */
  .msg-screen{height:100%;width:100%;
    display:flex;flex-direction:column;background:#fff;overflow:hidden;}
  .msg-screen .hdr{flex:0 0 auto;}
  .msg-screen .wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .msg-panel{flex:1 1 auto;min-height:0;margin:12px 16px;
    display:flex;flex-direction:column;border:1.5px solid #9aa5b1;border-radius:14px;overflow:hidden;background:var(--bg);}
  .chan-tabs2{display:flex;gap:0;margin:0;border-bottom:1.5px solid #9aa5b1;flex:0 0 auto;}
  .chan-tab2{position:relative;flex:1 1 auto;min-width:0;font-size:11px;font-weight:700;padding:11px 4px;
    border:none;border-right:1px solid var(--line);background:#eef1f5;color:var(--muted);cursor:pointer;
    overflow:visible;text-align:center;}
  .chan-tab2 .tab-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chan-tab2:last-child{border-right:none;}
  /* tabs fill the whole bar; the active one grows to show its full label and never truncates */
  .chan-tab2.on{flex:1 0 auto;max-width:100%;background:var(--indigo);color:#fff;font-size:13px;
    padding:11px 14px;}
  .chan-tab2.on .tab-label{overflow:visible;text-overflow:clip;}
  /* unread dot floating on a tab */
  .tab-badge{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;
    background:#e53935;box-shadow:0 0 0 2px #eef1f5;}
  .chan-tab2.on .tab-badge{box-shadow:0 0 0 2px var(--indigo);}
  .msg-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}

  /* ===== Announcements — category-tab layout ===== */
  .ann-hero{flex:0 0 auto;display:flex;align-items:center;gap:13px;background:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;border-bottom:1px solid var(--line);}
  .ann-hero-icon{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--indigo);
    display:flex;align-items:center;justify-content:center;}
  .ann-hero-icon svg{width:24px;height:24px;stroke:#fff;}
  .ann-hero-tx h1{font-size:21px;font-weight:800;letter-spacing:-.3px;color:var(--ink);}
  .ann-hero-tx .sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .ann-tabs{flex:0 0 auto;display:flex;gap:7px;background:#fff;padding:10px 14px 11px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);}
  .ann-tabs::-webkit-scrollbar{display:none;}
  .ann-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
    background:#eef1f5;color:var(--muted);border-radius:11px;padding:10px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;}
  .ann-tab.on{background:#fff;color:var(--indigo);box-shadow:0 1px 5px rgba(20,30,45,.16);}
  .ann-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
    padding:0 6px;border-radius:10px;background:#d8e1f1;color:var(--indigo);font-size:11px;font-weight:800;}
  .ann-tab.on .ann-count{background:var(--indigo);color:#fff;}
  .ann-count.unread{background:#e53935;color:#fff;}
  /* channel dropdown selector */
  .ann-dd{position:relative;flex:0 0 auto;background:#fff;padding:10px 14px 11px;border-bottom:1px solid var(--line);}
  .ann-dd-toggle{display:flex;align-items:center;gap:9px;width:100%;background:#eef1f5;border:1.5px solid var(--line);
    border-radius:11px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;}
  .ann-dd-cur{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ann-dd-caret{flex:0 0 auto;color:var(--muted);font-size:11px;transition:transform .15s;}
  .ann-dd.open .ann-dd-caret{transform:rotate(180deg);}
  .ann-dd-curdot{flex:0 0 auto;}
  .ann-dd-list{position:absolute;left:14px;right:14px;top:calc(100% - 3px);z-index:60;background:#fff;
    border:1.5px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(20,30,45,.18);
    overflow:hidden;max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .ann-dd-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
    border-bottom:1px solid var(--line);padding:13px 14px;font-size:14px;font-weight:700;color:var(--ink);
    cursor:pointer;text-align:left;}
  .ann-dd-item:last-child{border-bottom:none;}
  .ann-dd-item.sel{background:#f2f5fb;color:var(--indigo);}
  .ann-dd-item-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ann-dd-check{flex:0 0 auto;color:var(--indigo);font-weight:800;}
  .ann-subhead{flex:0 0 auto;padding:15px 20px 8px;}
  .ann-subhead-title{font-size:18px;font-weight:800;color:var(--ink);}
  .ann-subhead-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .ann-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 16px;}
  .ann-card{position:relative;background:#fff;border-radius:12px;border-left:4px solid var(--indigo);
    box-shadow:0 1px 3px rgba(20,30,45,.09);padding:15px 17px;margin-bottom:13px;}
  .ann-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ann-card-title{font-size:16px;font-weight:800;color:var(--ink);line-height:1.3;}
  .ann-card-title:empty{display:none;}
  .ann-card-author{font-size:14px;font-weight:800;color:var(--indigo);line-height:1.3;}
  .ann-role{display:inline-block;vertical-align:middle;margin-left:7px;font-size:10px;font-weight:800;
    letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--indigo);
    border-radius:6px;padding:2px 7px;}
  .ann-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e53935;margin-left:2px;}
  .ann-card-meta{flex:0 0 auto;display:flex;align-items:center;gap:4px;margin-left:auto;}
  .ann-card-time{font-size:12px;color:var(--muted);white-space:nowrap;}
  .ann-kebab{background:none;border:none;color:var(--muted);font-size:17px;line-height:1;padding:0 2px;cursor:pointer;font-weight:700;}
  .ann-card-body{font-size:14px;color:#3c4651;line-height:1.55;white-space:pre-wrap;margin-top:6px;}
  .ann-card-by{font-size:13px;color:var(--muted);margin-top:12px;}
  .ann-card-by b{color:#3c4651;font-weight:700;}
  /* empty-state for a channel with no announcements */
  .ann-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 18px 16px;}
  .ann-empty-icon{width:66px;height:66px;border-radius:50%;background:#e8edf6;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .ann-empty-icon svg{width:30px;height:30px;stroke:var(--indigo);}
  .ann-empty-title{font-size:17px;font-weight:800;color:var(--ink);}
  .ann-empty-sub{font-size:13.5px;color:var(--muted);margin-top:5px;max-width:300px;}
  .ann-tips{width:100%;max-width:360px;margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .ann-tip{display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:12px;padding:13px 15px;
    box-shadow:0 1px 3px rgba(20,30,45,.08);font-size:13px;color:#3c4651;text-align:left;line-height:1.45;}
  .ann-tip b{color:var(--ink);font-weight:700;}
  .ann-tip-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--indigo);margin-top:6px;}
  .ann-compose{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:11px 16px 12px;}
  .ann-compose-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px;}
  .ann-compose-namehint{font-size:12px;color:#9a5b00;background:#fff6e6;border:1px solid #ffe2a8;
    border-radius:9px;padding:7px 10px;margin-bottom:8px;}
  .ann-compose-who{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .ann-compose-who b{color:var(--ink);font-weight:700;}
  .ann-compose-who button{background:none;border:none;color:var(--indigo);font-weight:700;font-size:12px;cursor:pointer;padding:0;}
  .ann-name-row{align-items:center;}
  .ann-name-row .ann-compose-input{height:46px;box-sizing:border-box;}
  .ann-name-row .ann-compose-btn{height:46px;box-sizing:border-box;}
  .ann-compose-row{display:flex;gap:9px;align-items:flex-end;}
  .ann-compose-input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;
    font:inherit;font-size:14px;resize:none;max-height:120px;background:#f7f8fa;color:var(--ink);}
  .ann-compose-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--indigo);color:#fff;
    border:none;border-radius:11px;padding:11px 17px;font-weight:700;font-size:14px;cursor:pointer;}
  .ann-compose-btn svg{width:17px;height:17px;stroke:#fff;}
  .ann-compose-editing{display:flex;align-items:center;justify-content:space-between;
    background:#eef1f5;border-radius:9px;padding:6px 11px;margin-bottom:9px;font-size:12px;font-weight:600;color:var(--muted);}
  .ann-compose-editing button{background:none;border:none;color:var(--indigo);font-weight:700;font-size:12px;cursor:pointer;}

  .compose-bar{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;
    background:var(--bg);border-top:1px solid var(--line);padding:8px 16px;box-sizing:border-box;}
  .compose-spacer{height:88px;}
  .compose-input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;
    font:inherit;font-size:14px;resize:none;max-height:120px;background:#fff;color:var(--ink);}
  .compose-send{flex:0 0 auto;background:var(--indigo);color:#fff;border:none;border-radius:20px;
    padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;}
  .chap-opt{display:flex;align-items:center;gap:12px;padding:13px;border:2px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .chap-opt .opt-tx .on{font-weight:700;font-size:14px;display:block;}
  .chap-opt .opt-tx .od{font-size:11.5px;color:var(--muted);display:block;}
  .ch-shadow{background:#7b8794;}
  .ch-band-chap,.ch-orch-chap,.ch-choir-chap{background:#3d4a5c;}

  /* Add-activity form */

/* ---- Shadow Tour hotels (different from the performer tour) ----
   The performer day-by-day is the backbone of the app. The Shadow Tour follows the same legs of
   the trip but stays at its OWN hotels. We scope each performer hotel entry to the performers and
   inject the correct Shadow Tour hotel per day, so shadow travelers (Band/Orch Shadow, Choir
   Shadow) see THEIR hotel, address and phone — in the day plan, full logistics and check-in.
   Days 1 & 15 are flights; Day 14 the Shadow Tour is also at the Grand Nikko Daiba (no split). */
(function(){
  var SH=["sband","schoir"];
  function dropShadow(arr){ return (arr||ALL).filter(function(g){return g!=="sband"&&g!=="schoir";}); }
  var IKEBUKURO={n:"Hotel Metropolitan Tokyo Ikebukuro",q:"Hotel Metropolitan Tokyo Ikebukuro",addr:"1-6-1 Nishiikebukuro, Toshima-ku, Tokyo 171-8505",tel:"+81-3-3980-1111"};
  var KYOTO={n:"Hotel Nikko Princess Kyoto",q:"Hotel Nikko Princess Kyoto",addr:"630 Takahashicho, Shimogyo-ku, Kyoto 600-8096",tel:"+81-75-342-2111"};
  var AWAJI={n:"Grand Nikko Awaji",q:"Grand Nikko Awaji",addr:"2 Yumebutai, Awaji, Hyogo 656-2306",tel:"+81-799-74-1111"};
  var RIHGA={n:"Rihga Royal Hotel Hiroshima",q:"Rihga Royal Hotel Hiroshima",addr:"6-78 Motomachi, Naka-ku, Hiroshima 730-0011",tel:"+81-82-502-1121"};
  var SHADOW_DAY_HOTEL={
    2:IKEBUKURO, 3:IKEBUKURO, 4:IKEBUKURO, 5:IKEBUKURO,
    6:{n:"The Prince Hakone Lake Ashinoko",q:"The Prince Hakone Lake Ashinoko",addr:"144 Motohakone, Hakone-machi, Kanagawa 250-0592",tel:"+81-460-83-1111"},
    7:KYOTO, 8:KYOTO,
    9:AWAJI, 10:AWAJI,
    11:RIHGA, 12:RIHGA,
    13:{n:"Grand Prince Hotel Hiroshima",q:"Grand Prince Hotel Hiroshima",addr:"23-1 Motoujinamachi, Minami-ku, Hiroshima 734-8543",tel:"+81-82-256-1111"}
  };
  DAYS.forEach(function(d){
    var sh=SHADOW_DAY_HOTEL[d.d]; if(!sh) return;
    /* 1) map row: scope the performer hotels to performers, add the shadow hotel */
    (d.hotels||[]).forEach(function(h){ h.groups=dropShadow(h.groups); });
    d.hotels.push({n:sh.n+" (Shadow Tour)",q:sh.q,groups:SH});
    /* 2) full-logistics hotel blocks → performers only, then add a shadow hotel block */
    (d.logistics||[]).forEach(function(b){ if(/hotel/i.test(b.label||"")) b.groups=dropShadow(b.groups); });
    d.logistics.push({label:"Hotel — "+sh.n+" (Shadow Tour)",groups:SH,
      lines:[sh.n+" — "+sh.addr+" · "+sh.tel]});
    /* 3) check-in items → performers only, then add a shadow check-in */
    (d.items||[]).forEach(function(it){ if(it.type==="hotel" || /check[\s-]?in/i.test(it.title||"")) it.groups=dropShadow(it.groups); });
    d.items.push({t:"Evening",hr:"check-in",type:"hotel",groups:SH,
      title:"Hotel check-in (Shadow Tour)",
      desc:"Check in for the night at "+sh.n+" — "+sh.addr+" · "+sh.tel+"."});
  });
})();

function groupName(id){const g=GROUPS.find(x=>x.id===id);return g?g.short:"";}
function groupObj(id){return GROUPS.find(x=>x.id===id);}
/* ordered list of the user's selected groups */
function myGroups(){return GROUPS.filter(g=>state.groups.indexOf(g.id)>-1);}
/* combined label for headers / banners */
function groupLabel(){
  if(FB.isDirector) return "All groups";
  const ids=state.groups;
  if(ids.length===0) return "—";
  if(ids.length===GROUPS.length) return "All groups";
  return myGroups().map(g=>g.short).join("  +  ");
}
/* item visible if it applies to ANY of the user's selected groups */
/* directors see EVERY group's agenda each day, regardless of the groups they picked */
function egroups(){ return FB.isDirector ? ALL : state.groups; }
function myGroupsEff(){ return GROUPS.filter(function(g){return egroups().indexOf(g.id)>-1;}); }
function inGroup(item){return egroups().some(g=>item.groups.indexOf(g)>-1);}
/* which groups an item applies to (within the viewer's effective groups) */
function itemGroups(item){return myGroupsEff().filter(g=>item.groups.indexOf(g.id)>-1);}

/* Shadow Tour travelers (only sband/schoir selected) follow their own itinerary */
function isShadowOnly(){ return state.groups.length>0 && state.groups.every(function(g){return g==="sband"||g==="schoir";}); }
function DSET(){ return isShadowOnly()?SHADOW_DAYS:DAYS; }
function attireSet(){ return isShadowOnly()?SHADOW_ATTIRE:ATTIRE; }
/* day items visible to current group, plus custom items */
function visibleItems(di){
  const base=DSET()[di].items
    .map((it,idx)=>({...it,_idx:idx,_custom:false}))
    .filter(it=>inGroup(it));
  const cust=(state.custom[di]||[]).map((it,ci)=>({...it,_idx:"c"+ci,_custom:true}));
  return base.concat(cust);
}
function isExcluded(di,idx){return !!state.excluded[di+"_"+idx];}
function dayPerfCount(di){
  /* performers: count their own performances; shadow: count concerts they attend */
  return DSET()[di].items.filter(it=>it.type==="performance"&&inGroup(it)&&(isShadowOnly()||!it.gnote)).length;
}

const app=document.getElementById("app");
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* which bottom-nav tab is highlighted for each screen */
const NAV_FOR={overview:"trip",day:"trip",addact:"trip",emergency:"trip",
  cities:"cities",city:"cities",phrases:"cities",flight:"group",bus:"group",settings:"group",messages:"messages"};
function render(){
  let html="";
  if(state.screen==="onboard") html=viewOnboard();
  else if(state.screen==="overview") html=viewOverview();
  else if(state.screen==="day") html=viewDay();
  else if(state.screen==="cities") html=viewCities();
  else if(state.screen==="city") html=viewCity();
  else if(state.screen==="phrases") html=viewPhrases();
  else if(state.screen==="flight") html=viewFlight();
  else if(state.screen==="bus") html=viewBus();
  else if(state.screen==="emergency") html=viewEmergency();
  else if(state.screen==="addact") html=viewAddActivity();
  else if(state.screen==="messages") html=viewMessages();
  else if(state.screen==="settings") html=viewSettings();
  app.innerHTML=html;
  /* The bottom nav is its OWN persistent element (#navbar), never rebuilt as part of a
     screen — so it can never move. We only refresh its highlight/badge and hide it on onboarding. */

function fmt12(hhmm){
  const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||"");
  if(!m) return hhmm||"";
  let h=+m[1]; const mm=m[2]; const ap=h<12?"AM":"PM"; let h12=h%12; if(h12===0)h12=12;
  return h12+":"+mm+" "+ap;
}
function blockFor(hhmm){const h=+String(hhmm).split(":")[0]; return h<12?"Morning":h<17?"Afternoon":"Evening";}
function toMin(hhmm){const pp=String(hhmm).split(":"); return (+pp[0])*60+(+pp[1]);}
function parseSingleTime(hr){
  if(!hr) return null;
  let m=/(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(hr);
  if(m){let h=(+m[1])%12; if(/pm/i.test(m[3]))h+=12; return h*60+(+m[2]);}
  m=/^\s*(\d{1,2}):(\d{2})\s*$/.exec(hr);
  if(m) return (+m[1])*60+(+m[2]);
  return null;
}
/* order items in a block chronologically; items with no parseable time keep
   their authored position (carry the previous timed item's minute) */
function sortByTime(arr){
  let prev=-1;
  arr.forEach(it=>{const t=parseSingleTime(it.hr); if(t!=null){prev=t;it._sortT=t;} else {it._sortT=prev;}});
  return arr.map((it,i)=>[it,i]).sort((a,b)=>(a[0]._sortT-b[0]._sortT)||(a[1]-b[1])).map(x=>x[0]);
}
/* busy windows = important items (perf / rehearsal / exchange / travel / party) for the user's group */
function busyWindows(di){
  const out=[]; const imp=["performance","rehearsal","exchange","travel","party"];
  visibleItems(di).forEach(it=>{
    if(it._custom || imp.indexOf(it.type)<0) return;
    const txt=(it.desc||"")+"  "+(it.hr||"");
    const re=/(\d{1,2}):(\d{2})\s*[–—\-→]\s*(\d{1,2}):(\d{2})/g;
    let m,found=false;
    while((m=re.exec(txt))){
      const a=(+m[1])*60+(+m[2]), b=(+m[3])*60+(+m[4]);
      if(b>a){found=true; out.push({s:a,e:b,label:it.title});}
    }
    if(!found){const t=parseSingleTime(it.hr); if(t!=null) out.push({s:t,e:t+90,label:it.title});}
  });
  return out;
}
function activityConflict(di,hhmm){
  const t=toMin(hhmm);
  const w=busyWindows(di);
  for(const x of w){ if(t>=x.s && t<x.e) return x; }
  return null;
}
const MONIDX={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function jstToUtcMs(dm,dd,hhmm){
  const mi=MONIDX[dm]||0, day=+dd, p=String(hhmm||"0:0").split(":");
  return Date.UTC(2026, mi, day, (+p[0]||0), (+p[1]||0)) - 9*3600*1000; /* JST = UTC+9 */
}
/* get/refresh this device's web-push token (no permission prompt if already granted) */
async function ensureWebToken(){
  try{
    if(FB.webToken) return FB.webToken;
    if(!("Notification" in window) || Notification.permission!=="granted") return "";
    if(typeof firebase==="undefined" || !firebase.messaging) return "";
    if(!FB.messaging) FB.messaging=firebase.messaging();
    const reg=FB.swReg||(navigator.serviceWorker?await navigator.serviceWorker.ready:null);
    const token=await FB.messaging.getToken({vapidKey:WEB_PUSH_VAPID_KEY,serviceWorkerRegistration:reg||undefined});
    if(token){ FB.webToken=token; await saveWebToken(token); }
    return FB.webToken;
  }catch(e){ return ""; }
}
/* schedule a personal push reminder (delivered by the Cloud Function) */
async function saveReminder(di,time,remind,title){
  if(!remind || !FB.db) return;
  const d=DSET()[di];
  const fireAtMs=jstToUtcMs(d.dm,d.dd,time) - remind*60000;
  if(fireAtMs <= Date.now()){ toast("Activity added (reminder time already passed)"); return; }
  const token=await ensureWebToken();
  if(!token){ toast("Turn on notifications (Group tab) to get reminders"); return; }
  try{
    await FB.db.collection("reminders").add({
      token:token, title:"Reminder: "+title, body:title+" at "+fmt12(time),
      fireAtMs:fireAtMs, ts:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){}
}

/* stable per-device id so departure reminders are upserted, not duplicated */
function jtDeviceId(){
  let id=localStorage.getItem("jt_devid");
  if(!id){ id=Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem("jt_devid",id); }
  return id;
}
/* Schedule push reminders 1 hour and 15 min before:
     • the assigned flight group's outbound (SFO) and return (Tokyo) departures
     • each day's hotel departure for the ensemble(s) the traveler follows
   Reuses the personal-reminder pipeline (Cloud Function delivers them). */
async function scheduleDepartureReminders(){
  if(!FB.db) return;
  const token=await ensureWebToken();
  if(!token) return;                       /* notifications not enabled — nothing to do */
  const dev=jtDeviceId();
  const OFF=[{m:60,t:"in 1 hour"},{m:15,t:"in 15 minutes"}];
  const want={};                           /* id -> {fireAtMs,title,body} */

  /* --- flight departures (per assigned flight group A–I) --- */
  if(state.flight){
    const fl=FLIGHTS.find(function(f){return f.id===state.flight;});
    if(fl){
      const P=function(s){const m=String(s).match(/(\d{1,2}):(\d{2}).*?(\d{1,2})/);return m?{h:+m[1],mi:+m[2],day:+m[3]}:null;};
      const o1=P(fl.out.legs[0].dep), r1=P(fl.ret.legs[0].dep);
      /* outbound leaves SFO (Pacific, UTC-7 in June); return leaves Tokyo (JST, UTC+9) */
      if(o1){ const ms=Date.UTC(2026,5,o1.day,o1.h,o1.mi)+7*3600000;
        OFF.forEach(function(o){want[dev+"_fltout_"+o.m]={fireAtMs:ms-o.m*60000,
          title:"✈️ Flight "+state.flight+" departs "+o.t, body:fl.out.legs[0].no+" · "+fl.out.legs[0].from};}); }
      if(r1){ const ms=Date.UTC(2026,5,r1.day,r1.h,r1.mi)-9*3600000;
        OFF.forEach(function(o){want[dev+"_fltret_"+o.m]={fireAtMs:ms-o.m*60000,
          title:"✈️ Return flight departs "+o.t, body:fl.ret.legs[0].no+" · "+fl.ret.legs[0].from};}); }
    }
  }

  /* --- daily hotel departures for the ensemble(s) you follow --- */
  const AIR=/haneda|narita|airport|san francisco|\bSFO\b|\bLAX\b|\bSEA\b|departure for|truck loading/i;
  const depT=function(lines){
    if(lines.some(function(l){return AIR.test(l);})) return null;     /* skip airport-transfer days */
    for(const ln of lines){
      if(/venue|school|return/i.test(ln)) continue;                   /* not a hotel departure */
      const m=ln.match(/(\d{1,2}):(\d{2})\s*[—\-]\s*Depart hotel/i)
        || ln.match(/(\d{1,2}):(\d{2})\s*[—\-]\s*Departure\b/i)
        || ln.match(/(\d{1,2}):(\d{2})\s*depart\b/i);
      if(m) return (m[1].length<2?"0":"")+m[1]+":"+m[2];
    }
    return null;
  };
  DSET().forEach(function(d,di){
    (d.logistics||[]).forEach(function(b,bi){
      if(!b.groups || !b.groups.some(function(g){return state.groups.indexOf(g)>-1;})) return;
      const t=depT(b.lines||[]); if(!t) return;
      const ms=jstToUtcMs(d.dm,d.dd,t);
      OFF.forEach(function(o){want[dev+"_dep_"+di+"_"+bi+"_"+o.m]={fireAtMs:ms-o.m*60000,
        title:"🚌 Depart hotel "+o.t, body:(d.date.split(",")[0])+" — leave at "+fmt12(t)};});
    });
  });

  /* reconcile with what this device created before */
  let prev=[]; try{ prev=JSON.parse(localStorage.getItem("jt_depremids")||"[]"); }catch(e){}
  const now=Date.now();
  for(const id of prev){ if(!want[id]){ try{ await FB.db.collection("reminders").doc(id).delete(); }catch(e){} } }
  const keep=[];
  for(const id in want){
    const w=want[id];
    if(w.fireAtMs<=now) continue;          /* already passed */
    try{
      await FB.db.collection("reminders").doc(id).set({token:token, title:w.title, body:w.body,
        fireAtMs:w.fireAtMs, ts:firebase.firestore.FieldValue.serverTimestamp()});
      keep.push(id);
    }catch(e){}
  }
  try{ localStorage.setItem("jt_depremids",JSON.stringify(keep)); }catch(e){}
}

function accessibleChannels(){
  if(FB.isDirector) return CHANNELS.map(function(c){return c.id;});
  /* admin: every channel EXCEPT the directors-only chat */
  if(FB.isAdmin) return CHANNELS.map(function(c){return c.id;}).filter(function(id){return id!=="directors";});
  const set={};
  ensembleChannels().forEach(function(c){set[c]=1;});
  (FB.chapChannels||[]).forEach(function(ch){
    set[ch]=1;
    const base=ch.replace("-chap","");           /* band-chap -> band */
    if(["swesso","choir","swesso-shadow","choir-shadow"].indexOf(base)>-1) set[base]=1;
  });
  return Object.keys(set);
}

function msgTime(ms){
  try{return new Date(ms).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
  catch(e){return "";}
}
/* relative "2 hours ago" style time, falling back to a date for older posts */
function relTime(ms){
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<45) return "just now";
  const m=Math.floor(s/60); if(m<60) return m+" min"+(m===1?"":"s")+" ago";
  const h=Math.floor(m/60); if(h<24) return h+" hour"+(h===1?"":"s")+" ago";
  const d=Math.floor(h/24); if(d<7) return d+" day"+(d===1?"":"s")+" ago";
  return msgTime(ms);

function webPushSupported(){
  return !!(FB.configured && WEB_PUSH_VAPID_KEY && "serviceWorker" in navigator
    && "PushManager" in window && "Notification" in window);
}
async function enableWebPush(){
  if(typeof firebase==="undefined" || !firebase.messaging){ toast("Still connecting — try again in a moment"); return; }
  let perm;
  try{ perm=await Notification.requestPermission(); }catch(e){ toast("Couldn't request permission"); return; }
  if(perm!=="granted"){ window.jtNotifStatus("denied"); toast("Notifications not allowed"); return; }
  window.jtNotifStatus("granted");   /* gray the button right away */
  toast("Notifications enabled");
  try{
    if(!FB.messaging) FB.messaging=firebase.messaging();
    const reg=FB.swReg||(navigator.serviceWorker?await navigator.serviceWorker.ready:null);
    const token=await FB.messaging.getToken({vapidKey:WEB_PUSH_VAPID_KEY,serviceWorkerRegistration:reg||undefined});
    if(token){ FB.webToken=token; await saveWebToken(token); scheduleDepartureReminders(); }
  }catch(e){ /* permission is on; token can be retried on a later open */ }
}
async function saveWebToken(token){
  const channels=channelsForUser();
  try{
    const id=localStorage.getItem("jt_webdoc");
    if(id){ await FB.db.collection("webTokens").doc(id).set({token:token,channels:channels,ts:firebase.firestore.FieldValue.serverTimestamp()}); }
    else { const ref=await FB.db.collection("webTokens").add({token:token,channels:channels,ts:firebase.firestore.FieldValue.serverTimestamp()}); localStorage.setItem("jt_webdoc",ref.id); }
  }catch(e){}
}
async function syncWebChannels(){
  /* make sure the push token + its doc exist BEFORE writing channels — at sign-in the token
     may not be loaded yet, and we must not bail out (that left the device subscribed only to
     the public channels, so chaperone/director-channel pushes never arrived). */
  const token=await ensureWebToken();
  if(!token) return;                                  /* notifications not enabled — nothing to do */
  const id=localStorage.getItem("jt_webdoc"); if(!id) return;
  try{ await FB.db.collection("webTokens").doc(id).set({token:token,channels:channelsForUser(),
    ts:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
}
function notifBridge(){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.jtNotify)
    return {post:m=>{try{window.webkit.messageHandlers.jtNotify.postMessage(m);}catch(e){}}};
  if(window.JTNotify&&window.JTNotify.handle)
    return {post:m=>{try{window.JTNotify.handle(JSON.stringify(m));}catch(e){}}};
  return null;
}
function syncNotifTopics(){
  const br=notifBridge();
  if(br){ br.post({action:"setTopics",subscribe:channelsForUser(),all:NOTIF_TOPICS}); return; }
  syncWebChannels();
}
function enableNotifs(){
  const br=notifBridge();
  if(br){ br.post({action:"requestPermission"}); syncNotifTopics(); toast("Check the permission prompt"); return; }
  if(webPushSupported()){ enableWebPush(); return; }
  toast("Add this app to your Home Screen first, then enable notifications");
}

  let route="";
  TRIP.route.forEach((s,i)=>{
    route+=`<span class="stop">${esc(s)}</span>`;
    if(i<TRIP.route.length-1) route+=`<span class="arr">→</span>`;
  });
  let cards="";
  DAYSET.forEach((d,i)=>{
    const pc=dayPerfCount(i);
    const moves=d.items.some(it=>it.type==="travel"&&inGroup(it));
    let badges="";
    if(pc>0) badges+=`<span class="badge b-perf">${pc} performance${pc>1?"s":""}</span>`;
    if(d.items.some(it=>it.type==="sightseeing"&&inGroup(it)))
      badges+=`<span class="badge b-sight">Sightseeing</span>`;
    if(moves) badges+=`<span class="badge b-move">Travel day</span>`;

      <div class="day-tag"><div class="dn">${esc(d.dow)}</div>
        <div class="dd">${esc(d.dd)}</div><div class="dm">${esc(d.dm)}</div></div>
      <div class="day-body">
        <div class="dcity">Day ${d.d} · ${esc(d.city)}</div>
        <div class="ddate">${esc(d.date)}</div>
        <div class="dhead">${esc(d.headline)}</div>
        <div class="day-badges">${badges||'<span class="badge b-sight">Free / leisure</span>'}</div>
      </div>
      <div class="chev">›</div></div>`;
  });
  const multi=FB.isDirector||state.groups.length>1;
  return `<div class="screen">
   <div class="hdr">
     <h1>${esc(TRIP.title)}</h1>
     <div class="sub">${esc(TRIP.org)}</div>
     <div class="stats">
       <div class="stat"><div class="n">15</div><div class="l">Days</div></div>
       <div class="stat"><div class="n">5</div><div class="l">Cities</div></div>
       <div class="stat"><div class="n">${totalPerf}</div><div class="l">${multi?"Shows":"Your shows"}</div></div>

     ${busBanner()}

   </div></div>`;
}

/* ---- Day detail ---- */
function viewDay(){
  const di=state.dayIdx, d=DSET()[di];
  const multi=FB.isDirector||state.groups.length>1;
  const hotels=d.hotels.filter(h=>egroups().some(g=>h.groups.indexOf(g)>-1));
  const items=visibleItems(di);

  /* meals */
  let meals=d.meals.length
    ? `<div class="meal-row">${d.meals.map(m=>`<span class="meal">${esc(m)}</span>`).join("")}</div>`
    : `<div style="font-size:12px;color:var(--muted);">No group meals scheduled — meals on your own.</div>`;

  /* attire (from the itinerary) — entries matching the user's group(s) */
  const attMatch=(attireSet()[d.d]||[]).filter(a=>a.g.some(g=>egroups().indexOf(g)>-1));
  let attire=attMatch.length
    ? attMatch.map(a=>{
        const who=attMatch.length>1?myGroupsEff().filter(g=>a.g.indexOf(g.id)>-1).map(g=>g.short).join(" / "):"";
        return `<div class="attire-line">${who?`<span class="attire-who">${esc(who)}: </span>`:""}${esc(a.t)}</div>`;
      }).join("")
    : `<div style="font-size:12px;color:var(--muted);">Check with your director for today's attire.</div>`;

  /* hotels — when following several groups, note which group each hotel is for */
  let hotelHtml=hotels.length
    ? hotels.map(h=>{
        let kind="Your hotel";
        if(multi){
          const who=myGroupsEff().filter(g=>h.groups.indexOf(g.id)>-1).map(g=>g.short);
          kind=who.length===myGroupsEff().length?"All groups":who.join(", ");
        }
        return placeRow(h.n,kind,"hotel",h.q);
      }).join("")
    : `<div style="font-size:12px;color:var(--muted);">No hotel — ${di===0?"overnight flight":"departure day"}.</div>`;

  /* places: hotels + venues + sights from visible items */
  const seen={};
  let venues="",sights="";
  hotels.forEach(h=>{seen[h.n]=1;});
  items.forEach(it=>{
    if(it.loc&&!seen[it.loc.n]){
      seen[it.loc.n]=1;
      if(it.loc.kind==="venue") venues+=placeRow(it.loc.n,"Performance / venue","venue",it.loc.q);
      else if(it.loc.kind==="sight") sights+=placeRow(it.loc.n,"Sightseeing","sight",it.loc.q);
    }
  });

  /* timeline grouped by block */
  const order=["Pre-departure","Departure","Overnight","Daytime","Arrival","Morning","Late morning","Afternoon","Evening"];
  const blocks={};
  items.forEach(it=>{(blocks[it.t]=blocks[it.t]||[]).push(it);});
  let timeline="";
  const blkKeys=Object.keys(blocks).sort((a,b)=>{
    let ia=order.indexOf(a),ib=order.indexOf(b);
    if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib;
  });
  blkKeys.forEach(bk=>{
    timeline+=`<div class="blk-title">${esc(bk)}</div>`;
    sortByTime(blocks[bk]).forEach(it=>{timeline+=itemCard(di,it);});
  });
  if(!items.length) timeline=`<div class="empty">No scheduled items for your group today.</div>`;

  const note=d.note?`<div class="intro-note" style="margin-top:0;">Note: ${esc(d.note)}</div>`:"";

  return `<div class="screen">
   <div class="hdr">
     <div class="hdr-row">
       <button class="back" data-go="overview">‹</button>
       <div class="htxt">
         <h1>Day ${d.d} · ${esc(d.city)}</h1>
         <div class="sub">${esc(d.date)}</div>
       </div>
     </div>
     <div class="sub" style="margin-top:8px;">${esc(d.headline)}</div>
   </div>
   <div class="wrap">
     <div class="card">
       <div class="sec-title" style="margin:0 0 7px;">Meals included</div>
       ${meals}
     </div>
     <div class="card">
       <div class="sec-title" style="margin:0 0 7px;">Attire</div>
       ${attire}
     </div>
     ${note}
     <div class="sec-title">Schedule — ${esc(groupLabel())}</div>
     ${timeline}
     ${dayLogistics(di)}
     <button class="btn ghost" data-addcustom="${di}">+ Add your own activity</button>

     <div class="sec-title">Hotels</div>
     <div class="card">${hotelHtml}</div>
     ${venues?`<div class="sec-title">Performance venues</div><div class="card">${venues}</div>`:""}
     ${sights?`<div class="sec-title">Sightseeing & places</div><div class="card">${sights}</div>`:""}

     <div style="display:flex;gap:8px;margin-top:14px;">
       ${di>0?`<button class="btn ghost" data-day="${di-1}" style="margin-top:0;">‹ Day ${di}</button>`:""}
       ${di<DSET().length-1?`<button class="btn ghost" data-day="${di+1}" style="margin-top:0;">Day ${di+2} ›</button>`:""}
     </div>
   </div></div>`;
}

function dayLogistics(di){
  const d=DSET()[di];
  if(!d.logistics||!d.logistics.length) return "";
  const blocks=d.logistics.filter(b=>!b.groups||b.groups.some(g=>egroups().indexOf(g)>-1));
  if(!blocks.length) return "";
  const inner=blocks.map(b=>{
    const lines=b.lines.map(l=>`<li>${esc(l)}</li>`).join("");
    return `<div class="log-block"><div class="log-label">${esc(b.label)}</div><ul class="log-lines">${lines}</ul></div>`;
  }).join("");
  return `<button class="btn ghost log-toggle" data-toggle="logbox">▾ Full logistics & exact times</button>
    <div class="log-wrap" id="logbox" style="display:none;">${inner}</div>`;
}

function placeRow(name,kind,cls,q){
  const ic=cls==="hotel"?"H":cls==="venue"?"V":"S";
  const link=q?`<a class="go" target="_blank" rel="noopener" href="${mapsUrl(q)}">Map ›</a>`:"";
  return `<div class="place">
    <div class="place-ic pi-${cls}">${ic}</div>
    <div class="place-tx"><div class="pn">${esc(name)}</div>
      <div class="pk">${esc(kind)}</div></div>
    ${link}</div>`;
}

function itemCard(di,it){
  const idx=it._idx;
  const ex=isExcluded(di,idx);
  const nk=di+"_"+idx;
  const noteVal=state.notes[nk]||"";
  const tlabel=TYPE_LABEL[it.type]||"Item";
  const map=it.loc?`<a class="mini-btn map" target="_blank" rel="noopener" href="${mapsUrl(it.loc.q)}">📍 ${esc(it.loc.n)}</a>`:"";
  const gnote=(it.gnote?`<div class="item-gnote">${esc(it.gnote)}</div>`:"")+(it.remind?`<div class="item-gnote">⏰ Reminder ${esc(String(it.remind))} min before</div>`:"");
  let forChips="";
  if((FB.isDirector||state.groups.length>1) && !it._custom){
    const chips=itemGroups(it).map(g=>`<span class="fchip">${esc(g.short)}</span>`).join("");
    if(chips) forChips=`<div class="item-for"><span class="flabel">For</span>${chips}</div>`;
  }
  return `<div class="item t-${it.type} ${ex?"excluded":""} ${it._custom?"custom":""}">
    <div class="item-in">
      <div class="item-top">
        <span class="item-hr">${esc(it.hr||"")}</span>
        <span class="item-title">${esc(it.title)}</span>
        <span class="type-chip c-${it.type}">${esc(tlabel)}</span>
      </div>
      <div class="item-desc">${esc(it.desc)}</div>
      ${gnote}
      ${forChips}
      <div class="item-actions">
        ${map}
        <button class="mini-btn ex" data-excl="${nk}">${ex?"↺ Restore":"✕ Skip this"}</button>
        <button class="mini-btn" data-note="${nk}">✎ Note${noteVal?" •":""}</button>
        ${it._custom?`<button class="mini-btn ex" data-delc="${di}_${idx}">Delete</button>`:""}
      </div>
      <div class="note-box" id="nb_${nk}" style="display:${noteVal?"block":"none"};">
        <textarea data-noteinput="${nk}" placeholder="Your private note for this activity…">${esc(noteVal)}</textarea>
      </div>
    </div></div>`;
}

/* speak a phrase with the device's Japanese text-to-speech voice */
function speakJa(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Audio isn't supported on this device"); return; }
    var clean=String(text).replace(/_+/g,"").replace(/／/g,"、").replace(/\s*\/\s*/g," 、 ").trim();
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(clean);
    u.lang="ja-JP"; u.rate=0.85;
    var vs=window.speechSynthesis.getVoices()||[];
    var jp=vs.filter(function(v){return /ja[-_]JP/i.test(v.lang)||/Japanese|Kyoko|Otoya/i.test(v.name);})[0];
    if(jp) u.voice=jp;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("Couldn't play audio"); }
}

  const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
  const SEARCH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  let body="";
  PHRASES.forEach(function(group,ci){
    let rows="";
    group.items.forEach(function(p,ii){
      const q=(p.en+" "+p.ja+" "+p.ro).toLowerCase();
      rows+=`<div class="ph-row" data-q="${esc(q)}">
        <div class="ph-txt">
          <div class="ph-en">${esc(p.en)}</div>
          <div class="ph-ja">${esc(p.ja)}</div>
          <div class="ph-ro">${esc(p.ro)}</div>
        </div>
        <button class="ph-audio" data-speak="${ci}-${ii}" aria-label="Play pronunciation">${SPK}</button>
      </div>`;
    });
    body+=`<div class="ph-group"><div class="ph-cat">${esc(group.cat)}</div>${rows}</div>`;
  });
  return `<div class="screen">
   <div class="hdr">
     <div class="hdr-row">
       <button class="back" data-go="cities">‹</button>
       <div class="htxt"><h1>Translation Guide</h1><div class="sub">Common phrases · tap 🔊 to hear it</div></div>
     </div>
   </div>
   <div class="wrap">
     <div class="ph-search">${SEARCH_SVG}<input id="phSearch" type="search" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search phrases (English, romaji…)" value="${esc(state.phraseQ||"")}"><button class="ph-search-x" id="phSearchX" aria-label="Clear" style="display:${(state.phraseQ||"")?"flex":"none"};">×</button></div>
     <div class="intro-note" style="margin-top:0;">Point to the Japanese, read the romaji, and confirm with gestures or a map. Tip: the は in these phrases is said <b>“wa”</b> (not “ha”) — it marks the topic. And remember <b>和 (wa)</b>, harmony: keep your voice low on trains and in public, and look out for the group.</div>
     ${body}
     <div class="ph-noresult" style="display:none;">No phrases match your search.</div>
   </div></div>`;
}
/* live-filter the translation guide without re-rendering (keeps the search box focused) */
function filterPhrases(){
  const inp=document.getElementById("phSearch"); if(!inp) return;
  const q=(state.phraseQ||"").trim().toLowerCase();
  let anyVisible=false;
  document.querySelectorAll(".ph-group").forEach(function(g){
    let groupVisible=false;
    g.querySelectorAll(".ph-row").forEach(function(row){
      const hit=!q || (row.getAttribute("data-q")||"").indexOf(q)>-1;
      row.style.display=hit?"":"none";
      if(hit){ groupVisible=true; anyVisible=true; }
    });
    g.style.display=groupVisible?"":"none";
  });
  const nr=document.querySelector(".ph-noresult"); if(nr) nr.style.display=anyVisible?"none":"";
  const x=document.getElementById("phSearchX"); if(x) x.style.display=q?"flex":"none";
}
window._filterPhrases=filterPhrases;

    if(state.screen==="settings") state.pendGroups=state.groups.slice();

  const goB=cl("data-go");
  if(goB){state.screen=goB.dataset.go;
    if(state.screen==="settings") state.pendGroups=state.groups.slice();
    render();return;}

  const dayB=cl("data-day");

  const cityB=cl("data-city");
  if(cityB){state.cityIdx=+cityB.dataset.city;state.screen="city";render();return;}

  const exB=cl("data-excl");
  if(exB){const k=exB.dataset.excl;
    state.excluded[k]=!state.excluded[k];save(LS.excl,state.excluded);

    if(box){const show=box.style.display==="none";box.style.display=show?"block":"none";
      tgB.textContent=show?"▴ Hide full logistics":"▾ Full logistics & exact times";}

  const addB=cl("data-addcustom");
  if(addB){
    const di=+addB.dataset.addcustom;
    state.addForm={day:di,time:"",title:"",desc:"",addr:"",error:""};

/* Keyboard handling for the announcements compose box.
   When the compose/name input is focused: hide the bottom nav and shrink the app shell to the
   area above the keyboard (via visualViewport). That keeps the compose bar just above the
   keyboard and the header/channel selector in place, instead of the whole screen sliding up. */
(function(){
  var vv = window.visualViewport;
  var composeFocused = false;
  function isCompose(el){ return el && (el.id==="msgText" || el.id==="chapName"); }
  /* Decide nav state from the ACTUAL viewport, not from blur events: on iOS the keyboard's
     "down" key hides the keyboard without firing blur, so we must detect the viewport growing
     back and restore the nav immediately. */
  function refresh(){
    if(!vv) return;
    var kbOpen = composeFocused && (window.innerHeight - vv.height > 120);
    if(kbOpen){
      document.body.classList.add("kbd-open");
      document.documentElement.style.setProperty("--vvh", Math.round(vv.height)+"px");
    }else{
      document.body.classList.remove("kbd-open");
      document.documentElement.style.removeProperty("--vvh");
    }
  }
  document.addEventListener("focusin", function(e){
    if(isCompose(e.target)){
      composeFocused = true;
      refresh();
      setTimeout(function(){ try{ e.target.scrollIntoView({block:"nearest"}); }catch(_){} }, 120);
    }
  });
  document.addEventListener("focusout", function(e){
    if(isCompose(e.target)){
      /* small delay so moving focus between the two inputs doesn't flash the nav back */
      setTimeout(function(){ if(!isCompose(document.activeElement)){ composeFocused = false; refresh(); } }, 60);
    }
  });
  if(vv){ vv.addEventListener("resize", refresh); vv.addEventListener("scroll", refresh); }
})();

}catch(e){
  /* SELF-HEAL: a fatal render error would leave a blank screen. Clear caches + unregister
     the service worker once and reload, so a bad build can never strand the app. */
  try{
    if(!sessionStorage.getItem("jt_healed")){
      sessionStorage.setItem("jt_healed","1");
      Promise.resolve()
        .then(function(){ return ("caches" in window) ? caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}) : null; })
        .then(function(){ return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}) : null; })
        .then(function(){ location.reload(true); });
    }
  }catch(_){ try{ location.reload(true); }catch(__){} }
}

/* ---- active version check ----
   iOS home-screen PWAs often reopen a frozen snapshot without re-fetching, so the
   service-worker update cycle alone isn't reliable. On launch and every time the app comes
   back to the foreground, fetch the live index.html (cache-busted) and, if a newer
   APP_VERSION is published, refresh the worker and reload — so updates apply by themselves. */
var _updChecking=false;
async function checkForUpdate(){
  if(_updChecking || location.protocol.indexOf("http")!==0) return;
  _updChecking=true;
  try{
    const res=await fetch("index.html?_v="+Date.now(), {cache:"no-store"});
    const txt=await res.text();
    const m=txt.match(/APP_VERSION="(v\d+)"/);
    if(m && m[1]!==APP_VERSION){
      if(FB.swReg){ try{ await FB.swReg.update(); }catch(e){} }
      try{
        const ks=await caches.keys();
        await Promise.all(ks.map(function(k){return caches.delete(k);}));
      }catch(e){}
      location.reload(true);
      return;
    }
  }catch(e){ /* offline — try again next foreground */ }
  _updChecking=false;
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkForUpdate(); });
window.addEventListener("focus", checkForUpdate);
window.addEventListener("pageshow", checkForUpdate);
setTimeout(checkForUpdate, 1500);
setTimeout(function(){ try{ scheduleDepartureReminders(); }catch(e){} }, 4000);
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(r){
    FB.swReg=r;
    r.addEventListener("updatefound", function(){
      var nw=r.installing;
      if(nw) nw.addEventListener("statechange", function(){
        /* new version installed and an old one is in control → it will skipWaiting & take over */
        if(nw.state==="installed" && navigator.serviceWorker.controller){ /* controllerchange will reload */ }
      });
    });
    /* check for a new version each time the app is opened/refocused */
    try{ r.update(); }catch(e){}
    document.addEventListener("visibilitychange", function(){ if(!document.hidden){ try{ r.update(); }catch(e){} } });
  }).catch(function(){});
  /* when the freshly-installed SW takes control, reload once so the new UI shows immediately */
  var _reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(_reloaded) return; _reloaded=true; window.location.reload();
  });
  /* the worker asks open windows to reload after a self-healing update */
  navigator.serviceWorker.addEventListener("message", function(e){
    if(e.data && e.data.type==="jt-reload" && !_reloaded){ _reloaded=true; window.location.reload(); }
  });
}
</script>
</body>
</html>
